<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
<title id="title">Cloud computer lifecycle</title><desc id="desc">An agent run takes the computer lease on its first computer tool call, which starts the computer and installs the browser helper. The agent browses, runs commands, and saves files while other agents wait for the lease. When the run ends, Chrome closes cleanly and the computer stops. Files and sign-ins stay on its disk for the next start.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a08bb7"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:17px;font-weight:700;fill:#35344a}.detail{font-size:12px;fill:#8a8398}.label{font-size:10px;letter-spacing:1.5px;fill:#9b83b5}.on{fill:#16a085}.off{fill:#9aa1ad}</style></defs>
<rect width="1120" height="360" rx="20" fill="#f8f6fb"/>
<text x="32" y="38" class="label">CLOUD COMPUTER / STARTS WHEN NEEDED, STOPS WHEN DONE</text>
<g fill="#fff" stroke="#e3dcec"><rect x="32" y="90" width="230" height="170" rx="14"/><rect x="312" y="90" width="230" height="170" rx="14"/><rect x="592" y="90" width="230" height="170" rx="14"/><rect x="872" y="90" width="216" height="170" rx="14"/></g>
<text x="52" y="121" class="label">01 / FIRST TOOL CALL</text><text x="52" y="152" class="title">Lease the computer</text><text x="52" y="180" class="detail">One agent at a time;</text><text x="52" y="200" class="detail">others wait for the lease</text><circle cx="58" cy="232" r="5" class="off"/><text x="70" y="236" class="detail">Off → starting</text>
<text x="332" y="121" class="label">02 / START</text><text x="332" y="152" class="title">CloudHike computer</text><text x="332" y="180" class="detail">One per headquarters</text><text x="332" y="200" class="detail">Install browser helper once</text><circle cx="338" cy="232" r="5" class="on"/><text x="350" y="236" class="detail">Running · billed per second</text>
<text x="612" y="121" class="label">03 / WORK</text><text x="612" y="152" class="title">Browser · terminal · files</text><text x="612" y="180" class="detail">Chrome with saved sign-ins</text><text x="612" y="200" class="detail">Heartbeat keeps the lease</text><text x="612" y="236" class="detail">User watches live</text>
<text x="892" y="121" class="label">04 / RUN ENDS</text><text x="892" y="152" class="title">Release and stop</text><text x="892" y="180" class="detail">Close Chrome cleanly,</text><text x="892" y="200" class="detail">then stop the computer</text><circle cx="898" cy="232" r="5" class="off"/><text x="910" y="236" class="detail">Off · files kept free</text>
<g fill="none" stroke="#a08bb7" stroke-width="1.5" marker-end="url(#arrow)"><path d="M262 175H300"/><path d="M542 175H580"/><path d="M822 175H860"/></g>
<text x="32" y="306" class="detail">Kept on when another run here is waiting or the user opened it in the last 5 minutes. CloudHike also stops idle computers by itself.</text>
</svg>
