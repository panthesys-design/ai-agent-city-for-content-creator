<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
<title id="title">When an agent needs the user</title><desc id="desc">An agent calls ask_user or request_user_action, which saves an agent request. The city shows Needs you on the building, a header popover, and a card in chat. The user chooses an option, or signs in on the computer and the sign-in is detected automatically. The request resolves and the agent continues with its time limit resumed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a08bb7"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:17px;font-weight:700;fill:#35344a}.detail{font-size:12px;fill:#8a8398}.label{font-size:10px;letter-spacing:1.5px;fill:#9b83b5}</style></defs>
<rect width="1120" height="360" rx="20" fill="#f8f6fb"/>
<text x="32" y="38" class="label">AGENT REQUESTS / ASK, WAIT, CONTINUE BY ITSELF</text>
<g fill="#fff" stroke="#e3dcec"><rect x="32" y="90" width="230" height="170" rx="14"/><rect x="312" y="90" width="230" height="170" rx="14"/><rect x="592" y="90" width="230" height="170" rx="14"/><rect x="872" y="90" width="216" height="170" rx="14"/></g>
<text x="52" y="121" class="label">01 / AGENT</text><text x="52" y="152" class="title">ask_user</text><text x="52" y="176" class="title">request_user_action</text><text x="52" y="204" class="detail">Saves an agent request,</text><text x="52" y="224" class="detail">pauses its time limit</text>
<text x="332" y="121" class="label">02 / CITY</text><text x="332" y="152" class="title">Needs you</text><circle cx="460" cy="147" r="6" fill="#f0a020"/><text x="332" y="180" class="detail">Amber building badge</text><text x="332" y="200" class="detail">Header popover opens</text><text x="332" y="220" class="detail">Card in chat and popover</text>
<text x="612" y="121" class="label">03 / USER</text><text x="612" y="152" class="title">Choose or sign in</text><text x="612" y="180" class="detail">Option buttons (generative UI)</text><text x="612" y="200" class="detail">Or take control of the screen;</text><text x="612" y="220" class="detail">sign-in detected automatically</text>
<text x="892" y="121" class="label">04 / AGENT</text><text x="892" y="152" class="title">Continues</text><text x="892" y="180" class="detail">Reads the page again and</text><text x="892" y="200" class="detail">finishes the task; choices</text><text x="892" y="220" class="detail">are remembered</text>
<g fill="none" stroke="#a08bb7" stroke-width="1.5" marker-end="url(#arrow)"><path d="M262 175H300"/><path d="M542 175H580"/><path d="M822 175H860"/></g>
<text x="32" y="306" class="detail">Unanswered requests expire after COMPUTER_USER_WAIT_SECONDS (default 10 minutes); Skip lets the agent explain what it couldn't do.</text>
</svg>
