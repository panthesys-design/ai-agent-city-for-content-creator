<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isometric Campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one full-screen clay-white isometric stage; chrome floats in the corners */
  --ground:#e9ebee;
  --ground-edge:#d9dce0;
  --ink:#23272e;
  --muted:#6c7480;
  --panel:#ffffff;
  --accent:#ea2a55;
  --good:#58a80c;
  --font:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);color:var(--ink);
  background:radial-gradient(120% 90% at 50% 35%,#f1f2f4 0%,var(--ground) 55%,var(--ground-edge) 100%);
  overflow:hidden;
}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#stage.panning{cursor:grabbing}

.building{cursor:pointer;outline:none}
.building .lift{transition:transform .18s cubic-bezier(.3,.7,.3,1)}
.building:hover .lift{transform:translateY(-4px)}
.building.dragging{cursor:grabbing}
.building.dragging .lift{transform:translateY(-12px)}
.building .pad-top{transition:stroke .15s}
.building.selected .pad-top,
.building:focus-visible .pad-top{stroke:var(--accent);stroke-width:2.5}
.building .pad-shadow{transition:opacity .18s}
.building.dragging .pad-shadow{opacity:.6}

header{
  position:absolute;left:20px;top:18px;right:20px;pointer-events:none;
  display:flex;flex-direction:column;gap:4px;max-width:420px;
}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
header p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}

.toolbar{
  position:absolute;right:20px;bottom:20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
}
.toolbar button{
  font:600 13px var(--font);color:var(--ink);background:var(--panel);
  border:1px solid #d7dade;border-radius:10px;padding:9px 13px;cursor:pointer;
  box-shadow:0 1px 2px rgba(40,48,60,.08);
}
.toolbar button:hover{border-color:#b9bec5}
.toolbar button:focus-visible,.pop button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar .sq{width:38px;padding:9px 0;font-size:16px;line-height:1}
.toolbar .primary{background:var(--ink);color:#fff;border-color:var(--ink)}

.pop{
  position:absolute;left:0;top:0;width:296px;max-width:calc(100vw - 24px);
  background:var(--panel);border-radius:18px;padding:16px 16px 14px;
  box-shadow:0 18px 40px -12px rgba(35,42,54,.35),0 2px 6px rgba(35,42,54,.10);
  transform:translate(-50%,-100%);transform-origin:var(--tail-x,50%) 100%;
  animation:pop .22s cubic-bezier(.2,1.2,.4,1);
  z-index:5;
}
.pop[hidden]{display:none}
.pop::after{
  content:"";position:absolute;left:var(--tail-x,50%);bottom:-8px;width:18px;height:18px;
  background:var(--panel);border-radius:4px;transform:translateX(-50%) rotate(45deg);
  box-shadow:6px 6px 10px -4px rgba(35,42,54,.18);
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-100%) scale(.85)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
.pop .tag{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);margin-bottom:4px;
}
.pop h2{margin:0 28px 6px 0;font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.pop p{margin:0 0 12px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.pop dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.pop dl div{background:#f3f4f6;border-radius:10px;padding:8px 9px}
.pop dt{font-size:11px;color:var(--muted);margin-bottom:2px}
.pop dd{margin:0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pop dd.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}
.pop .close{
  position:absolute;right:10px;top:10px;width:28px;height:28px;border:0;border-radius:50%;
  background:#f1f2f4;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;
}
.pop .close:hover{background:#e6e8eb;color:var(--ink)}
.pop .remove{
  font:600 12.5px var(--font);color:var(--muted);background:none;border:0;padding:2px 0;cursor:pointer;
}
.pop .remove:hover{color:var(--accent)}

body.night{background:radial-gradient(120% 90% at 50% 35%,#2b3654 0%,#171d2e 60%,#0e121d 100%)}
body.night header{color:#e8edf6}
body.night header p{color:#9ba7bf}
body.night #view .body,body.night #traffic{filter:url(#nightFx)}
.lit{opacity:0;transition:opacity .6s}
body.night .lit{opacity:1}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.pop .actions{display:flex;justify-content:space-between;gap:12px}
.pop pre{
  margin:10px 0 0;max-height:190px;overflow:auto;background:#f3f4f6;border-radius:10px;padding:10px;
  font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#2f3640;
}
.pop pre[hidden]{display:none}


.custom{display:grid;gap:9px;margin-top:10px;max-height:330px;overflow:auto;padding:2px 2px 4px}
.custom[hidden],.custom .f[hidden]{display:none}
.custom .f{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.custom input[type=text],.custom select{font:500 13px var(--font);color:var(--ink);background:#f3f4f6;border:1px solid #e1e3e7;border-radius:8px;padding:6px 8px;width:100%}
.custom input[type=range]{width:100%;accent-color:#7c4dea}
.custom input:focus-visible,.custom select:focus-visible,.custom button:focus-visible{outline:2px solid #7c4dea;outline-offset:1px}
.custom .sws{display:flex;gap:6px;flex-wrap:wrap}
.custom .sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d7dade;cursor:pointer;padding:0}
.custom .sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.custom .chips{display:flex;gap:6px;flex-wrap:wrap}
.custom .chips label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);background:#f3f4f6;border-radius:999px;padding:4px 9px;cursor:pointer}
.custom .chips input{accent-color:#7c4dea;margin:0}
.custom .rangewrap{display:flex;align-items:center;gap:8px}
.custom output{font-weight:600;color:var(--ink);min-width:12px;font-variant-numeric:tabular-nums}

@media (max-width:480px){
  header h1{font-size:16px}
  .toolbar{left:16px;right:16px;bottom:16px}
}
@media (prefers-reduced-motion:reduce){
  .blink{animation:none}
  .building .lift{transition:none}
  .pop{animation:none}
}
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 1300 760" preserveAspectRatio="xMidYMid meet" aria-label="Isometric campus with movable buildings">
  <defs>
    <linearGradient id="padSide" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e6e9ec"/><stop offset="1" stop-color="#cfd4d9"/>
    </linearGradient>
    <linearGradient id="glassL" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#bfc7cf"/><stop offset=".3" stop-color="#d6dce1"/><stop offset="1" stop-color="#e3e7eb"/>
    </linearGradient>
    <linearGradient id="glassR" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#aab3bc"/><stop offset=".3" stop-color="#c2cad1"/><stop offset="1" stop-color="#d0d6dc"/>
    </linearGradient>
    <linearGradient id="grassSide" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b3dc74"/><stop offset="1" stop-color="#93c552"/>
    </linearGradient>
    <linearGradient id="earthSide" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#eadfcb"/><stop offset="1" stop-color="#d3c2a6"/>
    </linearGradient>
    <filter id="blurMid" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff1b8" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd36b" stop-opacity=".55"/><stop offset="1" stop-color="#ffb84a" stop-opacity="0"/></radialGradient>
    <linearGradient id="lvSide" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f1ecfa"/><stop offset=".5" stop-color="#e6dff4"/><stop offset="1" stop-color="#d3c9e8"/>
    </linearGradient>
    <radialGradient id="pool"><stop offset="0" stop-color="#ffb21f" stop-opacity=".85"/><stop offset=".45" stop-color="#f59e0b" stop-opacity=".45"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/></radialGradient>
    <filter id="nightFx" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.40 0 0 0 0.01  0 0.46 0 0 0.02  0 0 0.70 0 0.06  0 0 0 1 0"/></filter>
    <filter id="blurBig" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blurSm" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <g id="view">
    <g id="ground"></g>
    <g id="traffic"></g>
    <g id="scene"></g>
  </g>
</svg>

<header>
  <h1>Isometric Campus</h1>
  <p>Drag a building to move it. Click one for details; agent offices and HQ towers have a Customize panel. Try night mode. Drag the grass to pan, scroll to zoom.</p>
</header>

<div class="pop" id="pop" role="dialog" aria-labelledby="popTitle" hidden>
  <button class="close" id="popClose" aria-label="Close details">×</button>
  <span class="tag" id="popTag"></span>
  <h2 id="popTitle"></h2>
  <p id="popDesc"></p>
  <dl id="popStats"></dl>
  <div class="actions">
    <button class="remove" id="popCust" aria-expanded="false">Customize</button>
    <button class="remove" id="popSpec" aria-expanded="false">Show JSON spec</button>
    <button class="remove" id="popRemove">Remove</button>
  </div>
  <pre id="popJson" hidden></pre>
  <div class="custom" id="popCustom" hidden>
    <div class="f"><label for="cName">Name</label><input type="text" id="cName" maxlength="16"></div>
    <div class="f"><label for="cIcon">Icon</label><select id="cIcon">
      <option value="search">Search</option><option value="doc">Document</option><option value="wave">Voice</option>
      <option value="play">Video</option><option value="image">Image</option><option value="rocket">Rocket</option><option value="sparkle">Sparkle</option></select></div>
    <div class="f"><span>Colour</span><div class="sws" id="cTheme" role="group" aria-label="Colour"></div></div>
    <div class="f" data-only="agent"><label for="cFloors">Floors</label><div class="rangewrap"><input type="range" id="cFloors" min="1" max="4" step="1"><output id="cFloorsOut" for="cFloors"></output></div></div>
    <div class="f" data-only="agent"><label for="cGlass">Glass</label><select id="cGlass"><option value="full">Both sides</option><option value="front">Front only</option><option value="none">No glass (solid walls)</option></select></div>
    <div class="f" data-only="agent"><label for="cInterior">Inside</label><select id="cInterior">
      <option value="desk">Research desk</option><option value="writer">Writing desk</option><option value="voice">Voice booth</option>
      <option value="editing">Editing suite</option><option value="gallery">Art gallery</option><option value="publish">Publishing desk</option></select></div>
    <div class="f" data-only="agent"><span>Roof</span><div class="chips" id="cRoof">
      <label><input type="checkbox" value="tree">Tree</label><label><input type="checkbox" value="units">Units</label>
      <label><input type="checkbox" value="dish">Dish</label><label><input type="checkbox" value="solar">Solar</label>
      <label><input type="checkbox" value="garden">Garden</label></div></div>
    <div class="f" data-only="sky"><label for="cStyle">Style</label><select id="cStyle">
      <option value="empire">Art deco setbacks</option><option value="crown">Glass crown</option><option value="twin">Twin towers</option></select></div>
    <div class="f" data-only="sky"><label for="cHeight">Height</label><div class="rangewrap"><input type="range" id="cHeight" min="1" max="5" step="1"><output id="cHeightOut" for="cHeight"></output></div></div>
    <div class="f" data-only="sky"><label for="cTint">Windows</label><select id="cTint">
      <option value="blue">Blue glass</option><option value="teal">Teal glass</option><option value="warm">Warm glass</option><option value="clear">Clear glass</option></select></div>
    <div class="f" data-only="sky"><span>Top</span><div class="chips"><label><input type="checkbox" id="cSpire">Spire</label></div></div>
    <div class="f"><span>Plot</span><div class="chips"><label><input type="checkbox" id="cTrees">Trees and hedges</label></div></div>
  </div>
</div>

<div class="toolbar">
  <button class="sq" id="zoomOut" aria-label="Zoom out">−</button>
  <button class="sq" id="zoomIn" aria-label="Zoom in">+</button>
  <button id="night" aria-pressed="false">Night mode</button>
  <button id="reset">Reset layout</button>
  <button id="add">Add building</button>
  <button class="primary" id="addAgent">Add agent</button>
</div>

<script>
/* ============ EDIT ME: the buildings and what their bubbles say ============ */
const DEFAULTS = {
  buildings: [
    { id:'hq', type:'tower', x:0, y:0, accent:'#ff6b4a', glass:'blue',
      name:'Headquarters', tag:'Office tower',
      desc:'Main offices, a ground-floor cafe with parasols and a garden on the roof.',
      stats:[['Floors','9'],['People','240'],['Status','Open']],

        { type:'sign',        part:'main',  face:'right', u:12, w:72, v:144, h:22, text:'LAB' },

    { id:'researcher', type:'agent', x:290, y:290, label:'Researcher', icon:'search',
      theme:'lavender', floors:1, glass:'full', interior:'desk', roof:['tree','units'], trees:true,
      name:'Researcher', tag:'Agent office',

      theme:'peach', floors:1, glass:'front', interior:'gallery', roof:['solar','tree'], trees:true,

    { id:'tower2', type:'skyscraper', x:-290, y:290, label:'Crown HQ', icon:'rocket',
      style:'crown', theme:'sky', height:4, tint:'blue', spire:true, trees:true,
      name:'Crown HQ', tag:'Headquarters', desc:'Glass headquarters with a glowing crown at the top.',

    { id:'tower3', type:'skyscraper', x:-290, y:580, label:'Twin HQ', icon:'play',
      style:'twin', theme:'lavender', height:3, tint:'teal', spire:true, trees:true,

  links: [['hq','studio'],['hq','lab'],['lab','researcher'],['lab','master'],['master','script'],['researcher','script'],
          ['studio','voice'],['researcher','video'],['video','asset'],['script','asset'],
          ['hq','tower1'],['studio','tower2'],['voice','tower3']],   // roads between buildings

/* ========================================================================== */

const NS='http://www.w3.org/2000/svg';
const C=Math.cos(Math.PI/6), S=0.5;
const P=(x,y,z=0)=>[(x-y)*C,(x+y)*S-z];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const poly=(g,a,fill,extra={})=>el('polygon',Object.assign({points:pts(a),fill,stroke:fill,'stroke-width':.7,'stroke-linejoin':'round'},extra),g);

const COL={top:'#ffffff',left:'#f1f2f4',right:'#dfe2e6',roof:'#f3f4f6',roofLine:'#e2e5e8'};

/* ---------- drawing primitives ---------- */
function facePt(b,face,u,v){return face==='L'?P(b.x+u,b.y+b.d,b.z+v):P(b.x+b.w,b.y+u,b.z+v)}
let GLASS='clear', LIGHTS=null, SEED=1, LITN=0;
const GLASS_TINTS={
  clear:[['#bfc7cf','#d6dce1','#e3e7eb'],['#aab3bc','#c2cad1','#d0d6dc']],
  blue: [['#8db5e6','#bcd5f2','#dbe8f8'],['#7aa2d6','#a6c3ea','#c3d7f1']],
  teal: [['#7fcdc8','#b4e4e0','#d6f1ef'],['#68bab4','#9ad7d2','#bde6e2']],
  warm: [['#efc690','#f6dcb8','#fbecd6'],['#e0b27a','#ecca9f','#f3dcbc']],
};
(function(){const defs=document.querySelector('#stage defs');
  for(const [k,[l,r]] of Object.entries(GLASS_TINTS))[['L',l],['R',r]].forEach(([f,c])=>{
    const gr=el('linearGradient',{id:'g'+f+'-'+k,x1:0,x2:0,y1:0,y2:1},defs);
    [0,.3,1].forEach((o,i)=>el('stop',{offset:o,'stop-color':c[i]},gr));
  });})();
const rnd1=n=>{const v=Math.sin(n*12.9898+SEED*78.233)*43758.5453;return v-Math.floor(v)};
function pane(g,b,face,u,v,w,h,lit){
  const q=[facePt(b,face,u,v),facePt(b,face,u+w,v),facePt(b,face,u+w,v+h),facePt(b,face,u,v+h)];
  poly(g,q,'url(#g'+face+'-'+(GLASS_TINTS[GLASS]?GLASS:'clear')+')',{stroke:'none'});
  if(lit&&LIGHTS)poly(LIGHTS,q,face==='L'?'#ffd77a':'#f5c25e',{stroke:'none',class:'lit'});

function windows(g,b,face,o){

      el('path',{d:`M${cx-3},${cy} l-2.5,-6 M${cx},${cy} l0,-8.5 M${cx+3},${cy} l2.5,-6`,stroke:v<.5?'#a3d25e':'#b7df7c','stroke-width':1.7,'stroke-linecap':'round',fill:'none'},gb);
    }else if(t<.54){
      const c=['#ffffff','#ffd84a','#ff9fb5'][Math.floor(v*3)];
      [[-5,0],[3,-3],[1,4]].forEach(([dx,dy])=>{el('circle',{cx:cx+dx,cy:cy+dy,r:2.3,fill:c},gb);el('circle',{cx:cx+dx,cy:cy+dy,r:.9,fill:'#f0b429'},gb)});
    }else if(t<.63){
      const r=8+v*4;
      el('ellipse',{cx:cx+3,cy:cy+1,rx:r*1.5,ry:r*.55,fill:'#3f5a1e',opacity:.18},gb);
      el('circle',{cx:cx+r*.7,cy:cy-r*.55,r:r*.75,fill:'#7fb50e'},gb);
      el('circle',{cx:cx-r*.3,cy:cy-r*.75,r,fill:'#93c91a'},gb);
      el('circle',{cx:cx-r*.55,cy:cy-r*1.05,r:r*.5,fill:'#aede35'},gb);
    }else if(t<.72){
      tree(gb,x,y,1.05+v*.7);
    }else if(t<.75){
      el('ellipse',{cx,cy:cy+1.5,rx:7,ry:4,fill:'#c9ced4'},gb);el('ellipse',{cx,cy:cy-1,rx:7,ry:4,fill:'#f4f5f6'},gb);
    }
  });
}

/* ---------- traffic: cars on the lanes, people on the sidewalks ---------- */
const traffic=document.getElementById('traffic');
let MOVERS=[];
const SHOW_CARS=false;   // set to true to bring the cars back
const CAR_COLORS=['#ff5a5f','#ffc23d','#4f8cff','#ffffff','#2ec4a6','#8b5cf6'];
function car(axis,c){
  const g=el('g',{},traffic), sh=el('ellipse',{cx:0,cy:2,rx:17,ry:8,fill:'#3d4650',opacity:.22},g);
  const body=axis==='x'?{x:-12,y:-6,z:2,w:24,d:12,h:7}:{x:-6,y:-12,z:2,w:12,d:24,h:7};
  const cab =axis==='x'?{x:-6,y:-5,z:9,w:12,d:10,h:6}:{x:-5,y:-6,z:9,w:10,d:12,h:6};
  abox(g,body,c);
  box(g,Object.assign(cab,{ct:'#ffffff',cl:'#cfe1f4',cr:'#b2cbe6'}));
  const wheels=axis==='x'?[[-7,6],[7,6]]:[[6,-7],[6,7]];
  wheels.forEach(([x,y])=>{const q=P(x,y,2);el('circle',{cx:q[0],cy:q[1],r:2.6,fill:'#2d3138'},g)});
  return g;
}
function person(c){
  const g=el('g',{},traffic);
  el('ellipse',{cx:0,cy:0,rx:4,ry:2,fill:'#3d4650',opacity:.25},g);
  const legs=el('path',{d:'M-1.5,-1 L-1.5,-6 M1.5,-1 L1.5,-6',stroke:'#3c4452','stroke-width':1.8,'stroke-linecap':'round'},g);
  el('rect',{x:-3.2,y:-13.5,width:6.4,height:8.5,rx:2.6,fill:c},g);
  el('circle',{cx:0,cy:-16.5,r:2.9,fill:Math.random()<.5?'#f1c7a5':'#b97e56'},g);
  return {g,legs};
}
function setupTraffic(){
  traffic.textContent='';MOVERS=[];
  SEGS.forEach((s,si)=>{
    const axis=s.x1-s.x0>1?'x':'y', len=axis==='x'?s.x1-s.x0:s.y1-s.y0;
    if(SHOW_CARS)[-10,10].forEach((lane,li)=>{
      const n=Math.max(1,Math.round(len/120));
      for(let i=0;i<n;i++)MOVERS.push({kind:'car',g:car(axis,CAR_COLORS[(si*3+li*2+i)%CAR_COLORS.length]),s,axis,len,lane,dir:lane>0?1:-1,speed:36+((si+i+li)%3)*8,phase:len*i/n+li*40});
    });
    [-27,27].forEach((side,k)=>{
      const n=Math.max(1,Math.round(len/160));
      for(let i=0;i<n;i++){const p=person(FLOWERS[(si+i+k*2)%FLOWERS.length]==='#ffffff'?'#4f7cff':FLOWERS[(si+i+k*2)%FLOWERS.length]);
        MOVERS.push(Object.assign(p,{kind:'person',s,axis,len,lane:side,dir:k?1:-1,speed:10+((si+i)%3)*2,phase:len*(i+.5)/n}));}
    });
  });
  tick(performance.now());
}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(now){
  const t=now/1000;
  MOVERS.forEach(m=>{
    let d=((m.phase+t*m.speed*m.dir)%m.len+m.len)%m.len;
    const x=m.axis==='x'?m.s.x0+d:m.s.x0+m.lane, y=m.axis==='x'?m.s.y0+m.lane:m.s.y0+d, q=P(x,y);
    let bob=0;
    if(m.kind==='person'){bob=Math.abs(Math.sin(t*8+m.phase))*1.2;m.legs.setAttribute('transform',`scale(1,${(0.75+0.25*Math.cos(t*8+m.phase)).toFixed(2)}) translate(0,0)`)}
    m.g.setAttribute('transform',`translate(${q[0].toFixed(1)},${(q[1]-bob).toFixed(1)})`);
  });
}
(function loop(now){tick(now);if(!REDUCED)requestAnimationFrame(loop)})(performance.now());

/* ---------- popover ---------- */
function openPop(id){
  const b=state.buildings.find(x=>x.id===id);if(!b)return;
  openId=id;
  nodes.forEach((n,i)=>n.g.classList.toggle('selected',i===id));
  document.getElementById('popTag').textContent=b.tag;
  document.getElementById('popTitle').textContent=b.name;
  document.getElementById('popDesc').textContent=b.desc;
  const dl=document.getElementById('popStats');dl.textContent='';
  b.stats.forEach(([t,v])=>{
    const d=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');
    dt.textContent=t;dd.textContent=v;if(v==='Open')dd.className='ok';d.append(dt,dd);dl.append(d);
  });
  updateJson(b);
  document.getElementById('popJson').hidden=true;
  document.getElementById('popCustom').hidden=true;
  const cb=document.getElementById('popCust');cb.hidden=!['agent','skyscraper'].includes(b.type);cb.textContent='Customize';cb.setAttribute('aria-expanded','false');
  if(['agent','skyscraper'].includes(b.type))fillCustom(b);
  document.getElementById('popSpec').textContent='Show JSON spec';
  document.getElementById('popSpec').setAttribute('aria-expanded','false');
  pop.hidden=false;
  pop.style.animation='none';void pop.offsetWidth;pop.style.animation='';
  placePop(true);
}
function specOf(b){
  if(b.type==='agent'){const o=agentOpts(b);return {type:'agent',label:b.label||b.name,icon:b.icon||'search',theme:o.theme,floors:o.floors,glass:o.glass,interior:o.interior,roof:o.roof,trees:o.trees}}
  if(b.type==='skyscraper'){const o=skyOpts(b);return {type:'skyscraper',label:b.label||b.name,icon:b.icon||'sparkle',style:o.style,theme:o.theme,height:o.height,tint:o.tint,spire:o.spire,trees:o.trees}}
  return {type:b.type,accent:b.accent,glass:b.glass,extras:b.extras};
}
function updateJson(b){
  document.getElementById('popJson').textContent=JSON.stringify(specOf(b),null,2).replace(/\n {6,}/g,' ').replace(/\n {4}\]/g,' ]').replace(/\n {4}\}/g,' }');
}
const $=id=>document.getElementById(id);
(function(){const box=$('cTheme');
  Object.entries(THEMES).forEach(([k,t])=>{const btn=document.createElement('button');btn.type='button';btn.className='sw';btn.dataset.theme=k;
    btn.style.background=`linear-gradient(135deg,${t.side[0]} 0 50%,${t.accent} 50% 100%)`;btn.setAttribute('aria-label',k[0].toUpperCase()+k.slice(1));btn.setAttribute('aria-pressed','false');box.append(btn)});})();
function fillCustom(b){
  const kind=b.type==='skyscraper'?'sky':'agent';
  document.querySelectorAll('#popCustom [data-only]').forEach(r=>r.hidden=r.dataset.only!==kind);
  if(kind==='sky'){const q=skyOpts(b);
    $('cName').value=b.label||b.name||'';$('cIcon').value=b.icon||'sparkle';$('cStyle').value=q.style;
    $('cHeight').value=q.height;$('cHeightOut').textContent=q.height;$('cTint').value=q.tint;$('cSpire').checked=q.spire;$('cTrees').checked=q.trees;
    document.querySelectorAll('#cTheme .sw').forEach(s=>s.setAttribute('aria-pressed',String(s.dataset.theme===q.theme)));
    return;}
  const o=agentOpts(b);
  $('cName').value=b.label||b.name||'';$('cIcon').value=b.icon||'search';
  $('cFloors').value=o.floors;$('cFloorsOut').textContent=o.floors;
  $('cGlass').value=o.glass;$('cInterior').value=o.interior;$('cInterior').disabled=o.glass==='none';
  $('cTrees').checked=o.trees;
  document.querySelectorAll('#cRoof input').forEach(i=>i.checked=o.roof.includes(i.value));
  document.querySelectorAll('#cTheme .sw').forEach(s=>s.setAttribute('aria-pressed',String(s.dataset.theme===o.theme)));
}
function current(){return state.buildings.find(x=>x.id===openId)}
function applyChange(b){
  save();renderAll();
  const n=nodes.get(b.id);if(n)n.g.classList.add('selected');
  $('popTitle').textContent=b.name;updateJson(b);fillCustom(b);placePop();
}
$('cName').addEventListener('input',e=>{const b=current();if(!b)return;const v=e.target.value.trim()||'Agent';b.label=v;b.name=v;applyChange(b)});
$('cIcon').addEventListener('change',e=>{const b=current();if(b){b.icon=e.target.value;applyChange(b)}});
$('cFloors').addEventListener('input',e=>{const b=current();if(b){b.floors=+e.target.value;applyChange(b)}});
$('cGlass').addEventListener('change',e=>{const b=current();if(b){b.glass=e.target.value;applyChange(b)}});
$('cInterior').addEventListener('change',e=>{const b=current();if(b){b.interior=e.target.value;applyChange(b)}});
$('cStyle').addEventListener('change',e=>{const b=current();if(b){b.style=e.target.value;applyChange(b)}});
$('cHeight').addEventListener('input',e=>{const b=current();if(b){b.height=+e.target.value;applyChange(b)}});
$('cTint').addEventListener('change',e=>{const b=current();if(b){b.tint=e.target.value;applyChange(b)}});
$('cSpire').addEventListener('change',e=>{const b=current();if(b){b.spire=e.target.checked;applyChange(b)}});
$('cTrees').addEventListener('change',e=>{const b=current();if(b){b.trees=e.target.checked;applyChange(b)}});
$('cRoof').addEventListener('change',()=>{const b=current();if(b){b.roof=[...document.querySelectorAll('#cRoof input:checked')].map(i=>i.value);applyChange(b)}});
$('cTheme').addEventListener('click',e=>{const s=e.target.closest('.sw');const b=current();if(s&&b){b.theme=s.dataset.theme;applyChange(b)}});
$('popCust').onclick=()=>{
  const p=$('popCustom'),open=p.hidden;p.hidden=!open;$('popCust').textContent=open?'Hide options':'Customize';$('popCust').setAttribute('aria-expanded',String(open));
  if(open){$('popJson').hidden=true;$('popSpec').textContent='Show JSON spec';$('popSpec').setAttribute('aria-expanded','false')}
  placePop(true);
};
function closePop(){openId=null;pop.hidden=true;nodes.forEach(n=>n.g.classList.remove('selected'))}
function placePop(fit){
  if(!openId||!nodes.has(openId))return;
  const r=nodes.get(openId).anchor.getBoundingClientRect(), ax=r.left+r.width/2, ay=r.top;
  const w=pop.offsetWidth, h=pop.offsetHeight, m=10;
  if(fit&&ay-h-12<m){                                    // bubble would be cut off: slide the view down
    const unit=1/svg.getScreenCTM().a;ty+=(m-(ay-h-12))*unit;applyView();return;
  }
  const left=Math.min(Math.max(ax,w/2+m),innerWidth-w/2-m);
  pop.style.left=left+'px';pop.style.top=(ay-10)+'px';
  pop.style.setProperty('--tail-x',Math.min(Math.max(w/2+(ax-left),22),w-22)+'px');
}
document.getElementById('popClose').onclick=closePop;
document.getElementById('popSpec').onclick=()=>{
  const pre=document.getElementById('popJson'), btn=document.getElementById('popSpec');
  pre.hidden=!pre.hidden;btn.textContent=pre.hidden?'Show JSON spec':'Hide JSON spec';btn.setAttribute('aria-expanded',String(!pre.hidden));
  if(!pre.hidden){$('popCustom').hidden=true;$('popCust').textContent='Customize';$('popCust').setAttribute('aria-expanded','false')}
  placePop(true);
};
document.getElementById('night').onclick=e=>{
  const on=document.body.classList.toggle('night');
  e.currentTarget.textContent=on?'Day mode':'Night mode';e.currentTarget.setAttribute('aria-pressed',String(on));
};
document.getElementById('popRemove').onclick=()=>{
  const id=openId;closePop();
  state.buildings=state.buildings.filter(b=>b.id!==id);
  state.links=state.links.filter(l=>!l.includes(id));
  save();renderAll();
};

/* ---------- building interaction: drag to move, click to open ---------- */
function attach(g,b){
  let start=null,moved=false;
  g.addEventListener('pointerdown',e=>{
    if(e.button)return;e.stopPropagation();
    g.setPointerCapture(e.pointerId);
    start={cx:e.clientX,cy:e.clientY,w:toWorld(e.clientX,e.clientY),x:b.x,y:b.y};moved=false;
  });
  g.addEventListener('pointermove',e=>{
    if(!start)return;
    if(!moved&&Math.hypot(e.clientX-start.cx,e.clientY-start.cy)<5)return;
    if(!moved){moved=true;closePop();g.classList.add('dragging')}
    const w=toWorld(e.clientX,e.clientY);
    b.x=start.x+w.x-start.w.x;b.y=start.y+w.y-start.w.y;layout();
  });
  const end=e=>{
    if(!start)return;start=null;g.classList.remove('dragging');
    if(moved){save()}else if(e.type==='pointerup'){openId===b.id?closePop():openPop(b.id)}
  };
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  g.addEventListener('keydown',e=>{
    const step=e.shiftKey?40:10, mv={ArrowLeft:[-1,1],ArrowRight:[1,-1],ArrowUp:[-1,-1],ArrowDown:[1,1]}[e.key];
    if(mv){e.preventDefault();b.x+=mv[0]*step;b.y+=mv[1]*step;layout();save();g.focus();placePop()}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();openId===b.id?closePop():openPop(b.id)}
  });
}

/* ---------- pan and zoom ---------- */
let pan=null;
svg.addEventListener('pointerdown',e=>{
  if(e.button)return;svg.setPointerCapture(e.pointerId);
  const p=toSvg(e.clientX,e.clientY);pan={x:p.x,y:p.y,tx,ty,moved:false};
});
svg.addEventListener('pointermove',e=>{
  if(!pan)return;const p=toSvg(e.clientX,e.clientY);
  if(!pan.moved&&Math.hypot(p.x-pan.x,p.y-pan.y)<4)return;
  pan.moved=true;svg.classList.add('panning');tx=pan.tx+p.x-pan.x;ty=pan.ty+p.y-pan.y;applyView();
});
const panEnd=()=>{if(pan&&!pan.moved)closePop();pan=null;svg.classList.remove('panning')};
svg.addEventListener('pointerup',panEnd);svg.addEventListener('pointercancel',panEnd);
function zoomAt(cx,cy,f){
  const nk=Math.min(2.6,Math.max(.45,k*f)), p=toSvg(cx,cy);
  tx=p.x-(p.x-tx)*nk/k;ty=p.y-(p.y-ty)*nk/k;k=nk;applyView();
}
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015))},{passive:false});
document.getElementById('zoomIn').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.2);
document.getElementById('zoomOut').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.2);
addEventListener('resize',()=>placePop());
addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});

/* ---------- toolbar ---------- */
document.getElementById('reset').onclick=()=>{
  closePop();state=JSON.parse(JSON.stringify(DEFAULTS));save();renderAll();requestAnimationFrame(fitView);
};
document.getElementById('add').onclick=()=>{
  closePop();
  const n=state.buildings.length, type=TYPE_ORDER[n%TYPE_ORDER.length], id='b'+Date.now().toString(36);
  const spots=[[290,290],[580,0],[0,580],[-290,0],[0,-290],[580,290],[290,580],[-290,290],[290,-290]];
  const free=spots.find(s=>!state.buildings.some(b=>Math.abs(b.x-s[0])<200&&Math.abs(b.y-s[1])<200))||[290+n*30,290+n*30];
  const near=state.buildings.slice().sort((a,b)=>Math.hypot(a.x-free[0],a.y-free[1])-Math.hypot(b.x-free[0],b.y-free[1]))[0];
  const extras=JSON.parse(JSON.stringify(TEMPLATES[type]||[])).map(e=>e.type==='sign'?Object.assign(e,{text:'NEW'}):e);
  state.buildings.push({id,type,accent:ACCENTS[n%ACCENTS.length],glass:GLASSES[n%GLASSES.length],extras,x:free[0],y:free[1],name:'New building '+(n+1),tag:TYPE_TAG[type],
    desc:'Example text. Edit the buildings list at the top of the script to change it.',
    stats:[['Floors','–'],['People','–'],['Status','Open']]});
  if(near)state.links.push([near.id,id]);
  save();renderAll();
};

function freeSpot(){
  const spots=[];for(let r=0;r<6;r++)for(let c=-1;c<5;c++)spots.push([c*290,r*290]);
  spots.sort((a,b)=>Math.hypot(a[0]-290,a[1]-290)-Math.hypot(b[0]-290,b[1]-290));
  return spots.find(s=>!state.buildings.some(b=>Math.abs(b.x-s[0])<200&&Math.abs(b.y-s[1])<200))||[0,(state.buildings.length+1)*290];
}
const AGENT_PRESETS=[
  {label:'Publisher',icon:'rocket',theme:'mint',interior:'publish',floors:1,glass:'full',roof:['tree','units']},
  {label:'Analyst',icon:'search',theme:'sky',interior:'desk',floors:2,glass:'front',roof:['solar']},
  {label:'Designer',icon:'image',theme:'rose',interior:'gallery',floors:1,glass:'full',roof:['garden','units']},
  {label:'Narrator',icon:'wave',theme:'peach',interior:'voice',floors:1,glass:'front',roof:['dish']},
  {label:'Planner',icon:'sparkle',theme:'white',interior:'publish',floors:3,glass:'none',roof:['units','tree']},
];
let presetN=0;
$('addAgent').onclick=()=>{
  closePop();
  const pr=AGENT_PRESETS[presetN++%AGENT_PRESETS.length], id='a'+Date.now().toString(36), [x,y]=freeSpot();
  const near=state.buildings.slice().sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];
  const b=Object.assign({id,type:'agent',x,y,trees:true,name:pr.label,tag:'Agent office',
    desc:'A new agent office. Click Customize to change how it looks.',stats:[['Agents','1'],['Tasks','0'],['Status','Open']],extras:[]},JSON.parse(JSON.stringify(pr)));
  state.buildings.push(b);if(near)state.links.push([near.id,id]);
  save();renderAll();requestAnimationFrame(()=>{fitView();openPop(id)});
};
function fitView(){
  view.removeAttribute('transform');
  const bb=view.getBBox(), vb=svg.viewBox.baseVal;
  k=Math.min(vb.width/bb.width,(vb.height-60)/bb.height)*.94;
  tx=vb.width/2-(bb.x+bb.width/2)*k; ty=vb.height/2+18-(bb.y+bb.height/2)*k;
  applyView();
}
renderAll();applyView();requestAnimationFrame(fitView);
</script>
